[package]
name = "p2d"
version = "0.1.0"
description = "P2P Desktop Sharing Application"
authors = ["P2D Team"]
edition = "2021"

[lib]
name = "p2d_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.3"
arboard = "3.4"
cpal = "0.15"
tokio = { version = "1", features = ["rt", "sync", "net", "time"] }
xcap = "0.8.1"
image = { version = "0.25.9", features = ["png", "jpeg", "webp"] }
base64 = "0.22.1"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = "2.4.4"
discord-sdk = "0.4.0"
async-trait = "0.1.92"
